name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Mondays, 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pripipe
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Byte-compile
        run: python -m compileall -q pripipe

      - name: Unit tests
        run: python -m unittest discover -s pripipe/tests -t . -v

      - name: CLI smoke test
        run: |
          pripipe --version
          pripipe run --help > /dev/null
          pripipe validate --help > /dev/null

  e2e:
    name: end-to-end (conda environment + testdata)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SQANTI3 source
        uses: actions/checkout@v4
        with:
          repository: ConesaLab/SQANTI3
          ref: v5.5.4
          path: .sqanti3

      - name: Drop the local prefix from the exported environment
        shell: bash
        run: grep -v '^prefix:' env/environment.yml > env/ci-env.yml

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: env/ci-env.yml
          activate-environment: pri-miRNA-pipe

      - name: Verify environment
        run: bash env/verify_env.sh

      - name: Install pripipe
        run: pip install -e .

      - name: End-to-end run on testdata
        env:
          SQANTI3_DIR: ${{ github.workspace }}/.sqanti3
          CUPCAKE_DIR: /nonexistent   # falls back to isoseq3 collapse
        run: bash ci/run_ci.sh
